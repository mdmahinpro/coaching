  to     = "/.netlify/functions/send-email"
  status = 200

[[redirects]]
  from   = "/api/messaging-readiness"
  to     = "/.netlify/functions/messaging-readiness"
  status = 200

[[redirects]]
  from   = "/api/messaging-configuration"
  to     = "/.netlify/functions/messaging-configuration"
