[[redirects]]
  from   = "/api/resend-webhook"
  to     = "/.netlify/functions/resend-webhook"
  status = 200

[[redirects]]
  from   = "/api/mim-dlr-sync"
  to     = "/.netlify/functions/mim-dlr-sync"
