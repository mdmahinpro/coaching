[build]
  command   = "pnpm install --frozen-lockfile && pnpm run build"
  publish   = "dist"
  functions = "netlify/functions"

[build.environment]
  NODE_VERSION = "20"
  PORT         = "3000"
  BASE_PATH    = "/"

# Route the SMS API path to the serverless function (must precede the SPA catch-all).
[[redirects]]
  from   = "/api/send-sms"
  to     = "/.netlify/functions/send-sms"
  status = 200

[[redirects]]
  from   = "/*"
  to     = "/index.html"
  status = 200
