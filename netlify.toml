[build]
  command   = "pnpm run build:production"
  publish   = "dist"
  functions = "netlify/functions"

[build.environment]
  NODE_VERSION = "24.15.0"
  PNPM_VERSION = "11.10.0"
  PORT         = "3000"
  BASE_PATH    = "/"

[dev]
  command    = "pnpm run dev:netlify"
  targetPort = 5173
  port       = 8888
  autoLaunch = false

[[headers]]
  for = "/*"
  [headers.values]
    Content-Security-Policy = "default-src 'self'; script-src 'self'; style-src 'self' 'unsafe-inline' https://fonts.googleapis.com; font-src 'self' https://fonts.gstatic.com data:; img-src 'self' data: blob: https:; connect-src 'self' https://*.supabase.co wss://*.supabase.co https://*.ingest.sentry.io; object-src 'none'; base-uri 'self'; form-action 'self'; frame-src https://www.google.com; frame-ancestors 'none'; upgrade-insecure-requests"
    Referrer-Policy = "strict-origin-when-cross-origin"
    Permissions-Policy = "camera=(), microphone=(), geolocation=(), payment=(), usb=()"
    Strict-Transport-Security = "max-age=31536000; includeSubDomains"
    X-Content-Type-Options = "nosniff"
    X-Frame-Options = "DENY"

# Route API paths to serverless functions (must precede the SPA catch-all).
[[redirects]]
  from   = "/api/admissions"
  to     = "/.netlify/functions/admissions"
  status = 200

[[redirects]]
  from   = "/api/contact"
  to     = "/.netlify/functions/contact"
  status = 200

[[redirects]]
  from   = "/api/send-sms"
