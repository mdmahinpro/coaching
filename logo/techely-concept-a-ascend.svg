    <path d="M34 92 L60 66 L86 92" fill="none" stroke="#1B2A4A"
          stroke-width="11" stroke-linecap="round" stroke-linejoin="round" opacity="0.9"/>
    <circle cx="60" cy="4" r="7" fill="#FFB020"/>
  </g>

  <!-- Wordmark -->
  <g font-family="Inter, 'Segoe UI', Helvetica, Arial, sans-serif" fill="#1B2A4A">
    <text x="152" y="74" font-size="48" font-weight="800" letter-spacing="0.5">Techely</text>
    <text x="154" y="100" font-size="15" font-weight="600" letter-spacing="5.4" fill="#5A6B85">COACHING ACADEMY</text>
  </g>
</svg>
