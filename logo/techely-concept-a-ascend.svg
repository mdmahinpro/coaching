<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 540 140" role="img" aria-label="Techely Coaching Academy">
  <defs>
    <linearGradient id="a-grad" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#00C2A8"/>
      <stop offset="1" stop-color="#1B6EF3"/>
    </linearGradient>
  </defs>

  <!-- Mark: ascending chevrons inside a hex node -->
  <g transform="translate(8,10)">
    <polygon points="60,4 108,32 108,88 60,116 12,88 12,32"
             fill="none" stroke="url(#a-grad)" stroke-width="8" stroke-linejoin="round"/>
    <path d="M34 66 L60 40 L86 66" fill="none" stroke="url(#a-grad)"
